<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="454" rx="14" fill="#ffffff" stroke="#e4e7ee"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Detail&#8209;band soft&#8209;threshold (dead&#8209;zone)</text>
  <text x="36" y="62" font-size="14" fill="#6b7280">Detail inside the local IR contrast is zeroed (dust); beyond it passes, minus the threshold.</text>

  <!-- frame -->
  <rect x="90" y="88" width="600" height="300" fill="none" stroke="#e4e7ee"/>

  <!-- dead-zone band -->
  <rect x="290" y="88" width="200" height="300" fill="#d9820b" fill-opacity="0.09"/>

  <!-- gridlines -->
  <g stroke="#eef1f6" stroke-width="1">
    <line x1="90" y1="163" x2="690" y2="163"/>
    <line x1="90" y1="313" x2="690" y2="313"/>
    <line x1="190" y1="88" x2="190" y2="388"/>
    <line x1="590" y1="88" x2="590" y2="388"/>
  </g>

  <!-- centre axes -->
  <line x1="90" y1="238" x2="690" y2="238" stroke="#c2c8d2" stroke-width="1.3"/>
  <line x1="390" y1="88" x2="390" y2="388" stroke="#c2c8d2" stroke-width="1.3"/>

  <!-- ticks -->
  <g font-size="11" fill="#5b6472" text-anchor="end">
    <text x="82" y="92">+2</text>
    <text x="82" y="167">+1</text>
    <text x="82" y="242">0</text>
    <text x="82" y="317">&#8722;1</text>
    <text x="82" y="392">&#8722;2</text>
  </g>
  <g font-size="11" fill="#5b6472" text-anchor="middle">
    <text x="190" y="404">&#8722;2</text>
    <text x="390" y="404">0</text>
    <text x="590" y="404">+2</text>
  </g>
  <text x="390" y="430" font-size="13" fill="#3a4150" text-anchor="middle">detail</text>
  <text x="30" y="238" font-size="13" fill="#3a4150" text-anchor="middle" transform="rotate(-90 30 238)">r</text>

  <!-- identity r = d (reference) -->
  <line x1="190" y1="388" x2="590" y2="88" stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="524" y="150" font-size="12" fill="#8a92a1" transform="rotate(-36.9 524 150)">r = d  (no threshold)</text>

  <!-- threshold verticals -->
  <g stroke="#d9820b" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85">
    <line x1="290" y1="88" x2="290" y2="388"/>
    <line x1="490" y1="88" x2="490" y2="388"/>
  </g>

  <!-- the soft-threshold response r(d) -->
  <path fill="none" stroke="#3b45b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
        d="M90,388 L290,238 L490,238 L690,88"/>
  <circle cx="290" cy="238" r="4" fill="#3b45b8"/>
  <circle cx="490" cy="238" r="4" fill="#3b45b8"/>

  <!-- labels -->
  <text x="390" y="176" font-size="12.5" font-weight="600" fill="#b56b06" text-anchor="middle">dead zone</text>
  <text x="390" y="193" font-size="11.5" fill="#b56b06" text-anchor="middle">(dust removed)</text>
  <text x="285" y="80" font-size="11" fill="#b56b06" text-anchor="end">a<tspan baseline-shift="sub" font-size="8">lo,&#8467;</tspan>&#183;&#946;<tspan baseline-shift="sub" font-size="8">lo,&#8467;</tspan></text>
  <text x="495" y="80" font-size="11" fill="#b56b06" text-anchor="start">a<tspan baseline-shift="sub" font-size="8">hi,&#8467;</tspan>&#183;&#946;<tspan baseline-shift="sub" font-size="8">hi,&#8467;</tspan></text>
  <text x="150" y="330" font-size="11.5" fill="#3a4150">edge detail passes,</text>
  <text x="150" y="346" font-size="11.5" fill="#3a4150">minus the threshold</text>

  <!-- confidence note (separate step, not part of the curve) -->
  <text x="678" y="378" font-size="11" fill="#8a92a1" text-anchor="end">then  acc += r &#183; C<tspan baseline-shift="sub" font-size="8">&#8467;</tspan></text>
</svg>
