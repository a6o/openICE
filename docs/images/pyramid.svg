<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="454" rx="14" fill="#ffffff" stroke="#e4e7ee"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Normalized convolution at four scales</text>
  <text x="36" y="62" font-size="14" fill="#6b7280">Each scale is a weighted average that ignores defects &#8212; a hole&#8209;filling blur.</text>

  <!-- 9x9 pixel grid -->
  <g stroke="#e9ecf3" stroke-width="1">
    <line x1="90" y1="110" x2="90" y2="380"/><line x1="120" y1="110" x2="120" y2="380"/>
    <line x1="150" y1="110" x2="150" y2="380"/><line x1="180" y1="110" x2="180" y2="380"/>
    <line x1="210" y1="110" x2="210" y2="380"/><line x1="240" y1="110" x2="240" y2="380"/>
    <line x1="270" y1="110" x2="270" y2="380"/><line x1="300" y1="110" x2="300" y2="380"/>
    <line x1="330" y1="110" x2="330" y2="380"/><line x1="360" y1="110" x2="360" y2="380"/>
    <line x1="90" y1="110" x2="360" y2="110"/><line x1="90" y1="140" x2="360" y2="140"/>
    <line x1="90" y1="170" x2="360" y2="170"/><line x1="90" y1="200" x2="360" y2="200"/>
    <line x1="90" y1="230" x2="360" y2="230"/><line x1="90" y1="260" x2="360" y2="260"/>
    <line x1="90" y1="290" x2="360" y2="290"/><line x1="90" y1="320" x2="360" y2="320"/>
    <line x1="90" y1="350" x2="360" y2="350"/><line x1="90" y1="380" x2="360" y2="380"/>
  </g>

  <!-- defect cells (weight ~ 0) -->
  <g fill="#d9820b" fill-opacity="0.35">
    <rect x="150" y="140" width="30" height="30"/><rect x="150" y="170" width="30" height="30"/>
    <rect x="180" y="170" width="30" height="30"/><rect x="270" y="260" width="30" height="30"/>
    <rect x="270" y="290" width="30" height="30"/><rect x="300" y="200" width="30" height="30"/>
  </g>
  <g stroke="#b56b06" stroke-width="1.4" opacity="0.8">
    <path d="M153,143 l24,24 M177,143 l-24,24"/><path d="M153,173 l24,24 M177,173 l-24,24"/>
    <path d="M183,173 l24,24 M207,173 l-24,24"/><path d="M273,263 l24,24 M297,263 l-24,24"/>
    <path d="M273,293 l24,24 M297,293 l-24,24"/><path d="M303,203 l24,24 M327,203 l-24,24"/>
  </g>

  <!-- concentric scale windows, coarse -> fine -->
  <rect x="90"  y="110" width="270" height="270" fill="none" stroke="#b9bff0" stroke-width="2.6"/>
  <rect x="150" y="170" width="150" height="150" fill="none" stroke="#8e97e6" stroke-width="2.6"/>
  <rect x="180" y="200" width="90"  height="90"  fill="none" stroke="#5a63cf" stroke-width="2.6"/>
  <rect x="210" y="230" width="30"  height="30"  fill="none" stroke="#3b45b8" stroke-width="2.8"/>
  <circle cx="225" cy="245" r="4" fill="#3b45b8"/>
  <text x="225" y="398" font-size="11" fill="#6b7280" text-anchor="middle">target pixel + its neighbourhood</text>

  <!-- legend -->
  <g font-size="12.5" fill="#3a4150">
    <rect x="410" y="112" width="20" height="20" fill="none" stroke="#b9bff0" stroke-width="2.6"/>
    <text x="440" y="127">scale 0 &#183; ~9&#215;9 &#183; coarse base (L&#8320;)</text>
    <rect x="410" y="145" width="20" height="20" fill="none" stroke="#8e97e6" stroke-width="2.6"/>
    <text x="440" y="160">scale 1 &#183; ~5&#215;5</text>
    <rect x="410" y="178" width="20" height="20" fill="none" stroke="#5a63cf" stroke-width="2.6"/>
    <text x="440" y="193">scale 2 &#183; ~3&#215;3</text>
    <rect x="410" y="211" width="20" height="20" fill="none" stroke="#3b45b8" stroke-width="2.8"/>
    <text x="440" y="226">scale 3 &#183; 1&#215;1 &#183; raw pixel (L&#8323;)</text>
  </g>

  <!-- formula -->
  <text x="410" y="272" font-size="14" fill="#1f2430" font-family="'Cascadia Code','Consolas',monospace">value = &#931; k&#183;w&#183;x  /  &#931; k&#183;w</text>
  <text x="410" y="296" font-size="14" fill="#1f2430" font-family="'Cascadia Code','Consolas',monospace">conf&#160; C = &#931; k&#183;w</text>

  <!-- note -->
  <g font-size="12" fill="#6b7280">
    <text x="410" y="330">Defect cells carry weight w &#8776; 0, so they drop</text>
    <text x="410" y="347">out of the average: each scale is rebuilt from</text>
    <text x="410" y="364">intact neighbours. The gate pyramid runs this</text>
    <text x="410" y="381">on the IR gate; the colour L&#8209;pyramid on R,G,B.</text>
  </g>
</svg>
