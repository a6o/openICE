<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="454" rx="14" fill="#ffffff" stroke="#e4e7ee"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c2c8d2"/>
    </marker>
  </defs>

  <!-- accepted cone: |dIR/dR| <= 0.2 (bowtie around the x-axis) -->
  <path fill="#2f9e44" fill-opacity="0.10" stroke="none" d="M390,240 L690,128 L690,352 Z"/>
  <path fill="#2f9e44" fill-opacity="0.10" stroke="none" d="M390,240 L90,352 L90,128 Z"/>
  <g stroke="#57b368" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="90" y1="352" x2="690" y2="128"/>
    <line x1="90" y1="128" x2="690" y2="352"/>
  </g>

  <!-- x-y axes through the origin (centre) -->
  <line x1="80" y1="240" x2="702" y2="240" stroke="#c2c8d2" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="404" x2="390" y2="78" stroke="#c2c8d2" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="694" y="262" font-size="14" fill="#6b7280" text-anchor="end">&#948;R</text>
  <text x="402" y="90" font-size="14" fill="#6b7280">&#948;IR</text>

  <!-- (δR, δIR) points -->
  <g fill="#3b45b8">
    <circle cx="135" cy="254" r="4"/><circle cx="180" cy="247" r="4"/><circle cx="202.5" cy="233" r="4"/>
    <circle cx="240" cy="256.8" r="4"/><circle cx="270" cy="237.2" r="4"/><circle cx="300" cy="265.2" r="4"/>
    <circle cx="360" cy="242.8" r="4"/><circle cx="412.5" cy="234.4" r="4"/><circle cx="442.5" cy="248.4" r="4"/>
    <circle cx="472.5" cy="226" r="4"/><circle cx="502.5" cy="237.2" r="4"/><circle cx="532.5" cy="198" r="4"/>
    <circle cx="562.5" cy="228.8" r="4"/><circle cx="622.5" cy="217.6" r="4"/><circle cx="652.5" cy="212" r="4"/>
  </g>
  <!-- outliers, hollow (out of the cone -> rejected), same style as crosstalk.svg -->
  <g fill="#ffffff" stroke="#9aa2b1" stroke-width="1.6">
    <circle cx="330" cy="209.2" r="4"/><circle cx="592.5" cy="153.2" r="4"/>
  </g>

  <!-- captions -->
  <text x="600" y="306" font-size="12.5" fill="#2f8a3e" text-anchor="middle">|&#948;IR / &#948;R| &#8804; 0.2  &#8594; kept</text>
  <text x="600" y="139" font-size="12" fill="#8a92a1" text-anchor="middle">out of range &#8594; rejected</text>
  <line x1="597" y1="145" x2="592.5" y2="149" stroke="#9aa2b1" stroke-width="1"/>
</svg>
