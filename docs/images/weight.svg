<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="454" rx="14" fill="#ffffff" stroke="#e4e7ee"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Clean&#8209;confidence weight &#160; w(g)</text>
  <text x="36" y="62" font-size="14" fill="#6b7280">Intact pixels get full weight; defect pixels almost none.</text>

  <!-- plot frame: x 90..690, y 88..388 -->
  <rect x="90" y="88" width="600" height="300" fill="none" stroke="#e4e7ee"/>
  <g stroke="#eef1f6" stroke-width="1">
    <line x1="90" y1="245" x2="690" y2="245"/>
    <line x1="90" y1="102" x2="690" y2="102"/>
    <line x1="223" y1="88" x2="223" y2="388"/>
    <line x1="390" y1="88" x2="390" y2="388"/>
    <line x1="557" y1="88" x2="557" y2="388"/>
  </g>

  <!-- y ticks -->
  <g font-size="11" fill="#5b6472" text-anchor="end">
    <text x="82" y="392">0</text>
    <text x="82" y="386">0.02</text>
    <text x="82" y="249">0.5</text>
    <text x="82" y="106">1.0</text>
  </g>
  <!-- x ticks -->
  <g font-size="11" fill="#5b6472" text-anchor="middle">
    <text x="223" y="406">&#8722;1000</text>
    <text x="390" y="406">&#8722;500</text>
    <text x="557" y="406">0</text>
  </g>
  <text x="390" y="432" font-size="13" fill="#3a4150" text-anchor="middle">gate  g &#8722; IR_ref &#160; (density units, defect &#8592; &#160; &#8594; clear)</text>
  <text x="30" y="238" font-size="13" fill="#3a4150" text-anchor="middle" transform="rotate(-90 30 238)">weight  w</text>

  <!-- ramp: floor 0.02, linear rise, saturate at 1 -->
  <path fill="none" stroke="#3b45b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
        d="M90,382.3 L200.7,382.3 L516,102.3 L690,102.3"/>

  <!-- markers -->
  <circle cx="200.7" cy="382.3" r="4" fill="#3b45b8"/>
  <circle cx="516" cy="102.3" r="4" fill="#3b45b8"/>
  <circle cx="557" cy="102.3" r="5" fill="#d9820b"/>

  <!-- annotations -->
  <text x="100" y="372" font-size="12" fill="#3a4150">floor 0.02 (heavy defect)</text>
  <text x="600" y="94" font-size="12" fill="#3a4150" text-anchor="middle">w = 1 (full trust)</text>
  <text x="545" y="140" font-size="12" font-weight="600" fill="#b56b06">clear film (g &#8776; IR_ref)</text>
  <line x1="557" y1="107" x2="557" y2="132" stroke="#d9820b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- formula (top-left clear area) -->
  <text x="108" y="120" font-size="13" fill="#1f2430" font-family="'Cascadia Code','Consolas',monospace">w = clamp( 1 + (IR_ref + b &#8722; g)&#183;s , 0.02, 1 )</text>
  <text x="108" y="140" font-size="11.5" fill="#6b7280">slope s &lt; 0; anchors 0.85 (slope) and 0.98 (bias b)</text>
</svg>
