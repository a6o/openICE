<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="284" rx="14" fill="#ffffff" stroke="#e4e7ee"/>

  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c2c8d2" stroke-width="1.6"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa2b1"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Normalized convolution</text>
  <text x="36" y="62" font-size="14" fill="#6b7280">A weighted average that skips defect cells (w &#8776; 0), filling the hole from intact neighbours.</text>

  <!-- panel labels -->
  <text x="114" y="90" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">input window</text>
  <text x="614" y="90" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">estimate</text>

  <!-- ===== left grid: clean cells ===== -->
  <g stroke="#b9c8f0" stroke-width="1">
    <rect x="40"  y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="70"  y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="100" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="130" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="160" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="40"  y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="70"  y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="100" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="130" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="160" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="40"  y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="70"  y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="100" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="130" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="160" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="40"  y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="70"  y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="100" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="130" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="160" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="40"  y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="70"  y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="100" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="130" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="160" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/>
  </g>
  <!-- left grid: defect cells (w~0) overdrawn -->
  <g stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="3 2">
    <rect x="100" y="156" width="28" height="28" rx="3" fill="url(#hatch)"/>
    <rect x="130" y="156" width="28" height="28" rx="3" fill="url(#hatch)"/>
    <rect x="100" y="186" width="28" height="28" rx="3" fill="url(#hatch)"/>
  </g>
  <text x="187" y="150" font-size="11.5" fill="#8a92a1">w &#8776; 0</text>
  <line x1="182" y1="153" x2="156" y2="168" stroke="#9aa2b1" stroke-width="1"/>

  <!-- arrow 1 -->
  <line x1="200" y1="170" x2="236" y2="170" stroke="#9aa2b1" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== formula ===== -->
  <text x="248" y="175" font-size="14" fill="#1f2430" font-family="'Cascadia Code','Consolas',monospace">output =</text>
  <text x="392" y="160" font-size="13.5" fill="#1f2430" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace">&#931; k w x</text>
  <line x1="330" y1="167" x2="454" y2="167" stroke="#1f2430" stroke-width="1.3"/>
  <text x="392" y="185" font-size="13.5" fill="#1f2430" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace">&#931; k w</text>
  <text x="392" y="214" font-size="11.5" fill="#8a92a1" text-anchor="middle">defect cells drop out (w &#8776; 0)</text>

  <!-- arrow 2 -->
  <line x1="478" y1="170" x2="514" y2="170" stroke="#9aa2b1" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== right grid: hole filled ===== -->
  <g stroke="#b9c8f0" stroke-width="1">
    <rect x="540" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="570" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="600" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="630" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="660" y="96"  width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="540" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="570" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="600" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="630" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="660" y="126" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="540" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="570" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="600" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="630" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="660" y="156" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="540" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="570" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="600" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="630" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="660" y="186" width="28" height="28" rx="3" fill="#dfe7ff"/>
    <rect x="540" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="570" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="600" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="630" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/><rect x="660" y="216" width="28" height="28" rx="3" fill="#dfe7ff"/>
  </g>
  <!-- reconstructed cells: same neighbours, hole now filled -->
  <g stroke="#7d94e0" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="600" y="156" width="28" height="28" rx="3" fill="#eaf1ff"/>
    <rect x="630" y="156" width="28" height="28" rx="3" fill="#eaf1ff"/>
    <rect x="600" y="186" width="28" height="28" rx="3" fill="#eaf1ff"/>
  </g>
  <text x="614" y="262" font-size="11.5" fill="#3b45b8" text-anchor="middle">filled from neighbours</text>

  <!-- legend -->
  <rect x="40" y="262" width="13" height="13" rx="2.5" fill="#dfe7ff" stroke="#b9c8f0"/>
  <text x="59" y="272" font-size="11.5" fill="#6b7280">intact &#183; w = 1</text>
  <rect x="150" y="262" width="13" height="13" rx="2.5" fill="url(#hatch)" stroke="#9aa2b1" stroke-dasharray="3 2"/>
  <text x="169" y="272" font-size="11.5" fill="#6b7280">defect &#183; w &#8776; 0</text>
</svg>
