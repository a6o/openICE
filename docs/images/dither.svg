<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="454" rx="14" fill="#ffffff" stroke="#e4e7ee"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Dither envelope</text>
  <text x="36" y="62" font-size="14" fill="#6b7280">Zero&#8209;mean grain, peaking mid&#8209;band, vanishing at the band edges.</text>

  <!-- frame -->
  <rect x="90" y="88" width="600" height="312" fill="none" stroke="#e4e7ee"/>

  <!-- band edge guides -->
  <g stroke="#9aa2b1" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="192" y1="88" x2="192" y2="400"/>
    <line x1="688.8" y1="88" x2="688.8" y2="400"/>
  </g>
  <text x="192" y="82" font-size="11" fill="#8a92a1" text-anchor="middle">&#951;_lo = D(0.01M)</text>
  <text x="688" y="82" font-size="11" fill="#8a92a1" text-anchor="end">&#951;_hi = D(0.99M)</text>

  <!-- lens fill (grain amplitude envelope) -->
  <path fill="#3b45b8" fill-opacity="0.10" stroke="none"
        d="M192,244 L270,169.9 L330,131.6 L390,109.8 L440.4,104 L510,115 L570,142.1 L630,185.6 L688.8,244 L630,302.4 L570,345.9 L510,373 L440.4,384 L390,378.2 L330,356.4 L270,318.1 L192,244 Z"/>

  <!-- zero-mean baseline -->
  <line x1="90" y1="244" x2="690" y2="244" stroke="#c2c8d2" stroke-width="1.3" stroke-dasharray="2 3"/>

  <!-- per-pixel grain stems (zero-mean, modulated by the envelope) -->
  <g stroke="#3b45b8" stroke-width="1.6" opacity="0.75">
    <line x1="234" y1="244" x2="234" y2="213.7"/>
    <line x1="282" y1="244" x2="282" y2="285.5"/>
    <line x1="330" y1="244" x2="330" y2="148.5"/>
    <line x1="378" y1="244" x2="378" y2="322.7"/>
    <line x1="426" y1="244" x2="426" y2="202.1"/>
    <line x1="474" y1="244" x2="474" y2="347.1"/>
    <line x1="522" y1="244" x2="522" y2="175.3"/>
    <line x1="570" y1="244" x2="570" y2="284.8"/>
    <line x1="618" y1="244" x2="618" y2="199.5"/>
  </g>
  <g fill="#3b45b8">
    <circle cx="234" cy="213.7" r="2.4"/><circle cx="282" cy="285.5" r="2.4"/><circle cx="330" cy="148.5" r="2.4"/>
    <circle cx="378" cy="322.7" r="2.4"/><circle cx="426" cy="202.1" r="2.4"/><circle cx="474" cy="347.1" r="2.4"/>
    <circle cx="522" cy="175.3" r="2.4"/><circle cx="570" cy="284.8" r="2.4"/><circle cx="618" cy="199.5" r="2.4"/>
  </g>

  <!-- envelope curves -->
  <path fill="none" stroke="#3b45b8" stroke-width="2.4" stroke-linejoin="round"
        d="M192,244 L270,169.9 L330,131.6 L390,109.8 L440.4,104 L510,115 L570,142.1 L630,185.6 L688.8,244"/>
  <path fill="none" stroke="#3b45b8" stroke-width="2.4" stroke-linejoin="round" opacity="0.55"
        d="M192,244 L270,318.1 L330,356.4 L390,378.2 L440.4,384 L510,373 L570,345.9 L630,302.4 L688.8,244"/>

  <!-- ticks -->
  <g font-size="11" fill="#5b6472" text-anchor="end">
    <text x="82" y="108">+1</text>
    <text x="82" y="248">0</text>
    <text x="82" y="388">&#8722;1</text>
  </g>
  <g font-size="11" fill="#5b6472" text-anchor="middle">
    <text x="210" y="416">0.6</text>
    <text x="330" y="416">0.7</text>
    <text x="450" y="416">0.8</text>
    <text x="570" y="416">0.9</text>
    <text x="690" y="416">1.0</text>
  </g>
  <text x="390" y="440" font-size="13" fill="#3a4150" text-anchor="middle">pixel density  x  (fraction of M)</text>
  <text x="28" y="244" font-size="13" fill="#3a4150" text-anchor="middle" transform="rotate(-90 28 244)">grain amplitude (&#215; peak)</text>

  <!-- labels -->
  <text x="440" y="98" font-size="12" fill="#3a4150" text-anchor="middle">envelope peaks mid&#8209;band</text>
  <text x="140" y="250" font-size="11.5" fill="#6b7280" text-anchor="middle">no dither</text>
  <text x="108" y="126" font-size="12" fill="#1f2430" font-family="'Cascadia Code','Consolas',monospace">envelope = 4&#183;(x&#8722;&#951;_lo)(&#951;_hi&#8722;x) / (&#951;_hi&#8722;&#951;_lo)&#178;</text>
</svg>
