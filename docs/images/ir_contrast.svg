<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="8" y="8" width="704" height="364" rx="14" fill="#ffffff" stroke="#e4e7ee"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2430">Selecting the IR&#8209;contrast band [&#946;<tspan baseline-shift="sub" font-size="12">lo,&#8467;</tspan>, &#946;<tspan baseline-shift="sub" font-size="12">hi,&#8467;</tspan>]</text>
  <text x="36" y="62" font-size="13.5" fill="#6b7280">min and max of the gate&#8209;pyramid detail  P<tspan baseline-shift="sub" font-size="9">&#8467;</tspan> &#8722; P<tspan baseline-shift="sub" font-size="9">&#8467;&#8722;1</tspan>  over a 5&#8209;point cross.</text>

  <!-- base 3x3 neighbourhood -->
  <rect x="90" y="110" width="210" height="210" fill="#f5f7fb"/>

  <!-- the sampled + cross (5 cells) -->
  <g fill="#dfe7ff">
    <rect x="160" y="110" width="70" height="70"/>   <!-- up -->
    <rect x="90"  y="180" width="70" height="70"/>   <!-- left -->
    <rect x="160" y="180" width="70" height="70"/>   <!-- center -->
    <rect x="230" y="180" width="70" height="70"/>   <!-- right -->
    <rect x="160" y="250" width="70" height="70"/>   <!-- down -->
  </g>

  <!-- grid lines -->
  <path fill="none" stroke="#cdd5e4" stroke-width="1"
        d="M90 110V320M160 110V320M230 110V320M300 110V320M90 110H300M90 180H300M90 250H300M90 320H300"/>

  <!-- max / min highlight borders -->
  <rect x="230" y="180" width="70" height="70" fill="none" stroke="#1f9d6b" stroke-width="2.6"/>
  <rect x="160" y="250" width="70" height="70" fill="none" stroke="#d9820b" stroke-width="2.6"/>
  <rect x="90" y="110" width="210" height="210" fill="none" stroke="#b9c8f0" stroke-width="1.4"/>

  <!-- cross values (P_l - P_{l-1} at each point) -->
  <g font-size="19" font-weight="600" text-anchor="middle">
    <text x="195" y="152" fill="#1f2430">+0.5</text>
    <text x="125" y="222" fill="#1f2430">+0.1</text>
    <text x="195" y="222" fill="#1f2430">+0.3</text>
    <text x="265" y="222" fill="#1f9d6b">+0.8</text>
    <text x="195" y="292" fill="#d9820b">&#8722;0.2</text>
  </g>
  <text x="272" y="174" font-size="9.5" fill="#1f9d6b" text-anchor="end">max</text>
  <text x="167" y="312" font-size="9.5" fill="#d9820b">min</text>
  <text x="195" y="342" font-size="11" fill="#8a92a1" text-anchor="middle">only the + cross is sampled (corners ignored)</text>

  <!-- extraction -->
  <text x="372" y="150" font-size="14.5" fill="#1f9d6b">&#946;<tspan baseline-shift="sub" font-size="10">hi,&#8467;</tspan> = max of the 5 = +0.8</text>
  <text x="372" y="180" font-size="14.5" fill="#d9820b">&#946;<tspan baseline-shift="sub" font-size="10">lo,&#8467;</tspan> = min of the 5 = &#8722;0.2</text>

  <!-- number line -->
  <line x1="392" y1="252" x2="686" y2="252" stroke="#c2c8d2" stroke-width="1.3"/>
  <rect x="509" y="246" width="150" height="12" fill="#3b45b8" fill-opacity="0.14"/>
  <g stroke-width="2.4">
    <line x1="509" y1="242" x2="509" y2="262" stroke="#d9820b"/>
    <line x1="659" y1="242" x2="659" y2="262" stroke="#1f9d6b"/>
  </g>
  <text x="509" y="234" font-size="11.5" fill="#d9820b" text-anchor="middle">&#946;<tspan baseline-shift="sub" font-size="8">lo,&#8467;</tspan></text>
  <text x="659" y="234" font-size="11.5" fill="#1f9d6b" text-anchor="middle">&#946;<tspan baseline-shift="sub" font-size="8">hi,&#8467;</tspan></text>
  <g font-size="10" fill="#8a92a1" text-anchor="middle">
    <text x="392" y="274">&#8722;1</text>
    <text x="534" y="274">0</text>
    <text x="686" y="274">+1</text>
  </g>
  <text x="539" y="296" font-size="11" fill="#6b7280" text-anchor="middle">value of the gate detail  P<tspan baseline-shift="sub" font-size="8">&#8467;</tspan> &#8722; P<tspan baseline-shift="sub" font-size="8">&#8467;&#8722;1</tspan></text>

  <!-- hand-off note -->
  <text x="372" y="340" font-size="11" fill="#8a92a1">&#8594; the band [&#946;<tspan baseline-shift="sub" font-size="8">lo,&#8467;</tspan>, &#946;<tspan baseline-shift="sub" font-size="8">hi,&#8467;</tspan>] is the dead&#8209;zone for the colour detail (&#215; a<tspan baseline-shift="sub" font-size="8">lo,&#8467;</tspan>, a<tspan baseline-shift="sub" font-size="8">hi,&#8467;</tspan>).</text>
</svg>
